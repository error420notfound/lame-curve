<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Blur Effect</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        .frame {
            display: block;
            flex: 0 0 auto;
            pointer-events: none;
            position: relative;
            border-radius: 0px;
            overflow-x: visible;
            overflow-y: visible;
            height: 100%;
            width: 100%;
            transform: none;
        }

        .frame::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 11;
            pointer-events: none;
            background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImJsYWNrIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIgY2xhc3M9Imx1Y2lkZSBsdWNpZGUtYXN0ZXJpc2staWNvbiBsdWNpZGUtYXN0ZXJpc2siPjxwYXRoIGQ9Ik0xMiA1djE0Ii8+PHBhdGggZD0ibTE4LjA2NSA4LjQ5Ni0xMi4xMjUgNyIvPjxwYXRoIGQ9Im01Ljk0IDguNTA0IDEyLjEyNSA3Ii8+PC9zdmc+");
            background-repeat: repeat;
            background-position: top left;
            background-size: 24px 24px;
        }

      

        .layer {
            position: absolute;
            inset: 0;
            height: 100%;
            width: 100%;
            border-radius: 0px;
        }
    </style>
</head>
<body>
    <div class="frame" style="z-index: 11;">
        <div class="layer" style="background-color: #fef2f300; backdrop-filter: blur(0px);                 -webkit-backdrop-filter: blur(0px);                 mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 1) 20%); -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 1) 20%); z-index: 4;"></div>
        <div class="layer" style="background-color: #fde6e700; backdrop-filter: blur(0.2px); -webkit-backdrop-filter: blur(0.205761316872428px); mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 10%, rgba(0, 0, 0, 1) 30%); -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 10%, rgba(0, 0, 0, 1) 30%); z-index: 6;"></div>
        <div class="layer" style="background-color: #fbd0d500; backdrop-filter: blur(0.8px); -webkit-backdrop-filter: blur(0.823045267489712px); mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 20%, rgba(0, 0, 0, 1) 40%); -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 20%, rgba(0, 0, 0, 1) 40%); z-index: 8;"></div>
        <div class="layer" style="background-color: #f27a8a00; backdrop-filter: blur(1.85px); -webkit-backdrop-filter: blur(1.8518518518518516px); mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 1) 50%); -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 1) 50%); z-index: 10;"></div>
        <div class="layer" style="background-color: #ea546d00; backdrop-filter: blur(3.29px); -webkit-backdrop-filter: blur(3.292181069958848px); mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 1) 60%); -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 1) 60%); z-index: 12;"></div>
        <div class="layer" style="background-color: #d5294e00; backdrop-filter: blur(5.14px); -webkit-backdrop-filter: blur(5.144032921810701px); mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 1) 70%); -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 1) 70%); z-index: 14;"></div>
        <div class="layer" style="background-color: #b31d4000; backdrop-filter: blur(7.40px); -webkit-backdrop-filter: blur(7.4074074074074066px); mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 1) 80%); -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 1) 80%); z-index: 16;"></div>
        <div class="layer" style="background-color: #961b3c00; backdrop-filter: blur(10.08px); -webkit-backdrop-filter: blur(10.082304526748972px); mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, 1) 90%); -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 70%, rgba(0, 0, 0, 1) 90%); z-index: 18;"></div>
        <div class="layer" style="background-color: #811a3900; backdrop-filter: blur(13.16px); -webkit-backdrop-filter: blur(13.168724279835391px); mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 80%, rgba(0, 0, 0, 1) 100%); -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 80%, rgba(0, 0, 0, 1) 100%); z-index: 20;"></div>
        <div class="layer" style="background-color: #48091a00; backdrop-filter: blur(16.66px); -webkit-backdrop-filter: blur(16.666666666666668px); mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 90%, rgba(0, 0, 0, 1) 100%); -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 90%, rgba(0, 0, 0, 1) 100%); z-index: 22;"></div>
       
            
    </div>
</body>
</html>
